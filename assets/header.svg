<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Bhuvan Prakash — Software Engineer, Android and Full-Stack">
  <title>Bhuvan Prakash — Software Engineer · Android &amp; Full-Stack</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111C2E"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#7DD3FC" fill-opacity="0.10"/>
    </pattern>

    <clipPath id="card">
      <rect x="0" y="0" width="1000" height="240" rx="16"/>
    </clipPath>

    <style>
      .fade {
        opacity: 0;
        animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .d1 { animation-delay: 0.10s; }
      .d2 { animation-delay: 0.26s; }
      .d3 { animation-delay: 0.42s; }
      .d4 { animation-delay: 0.58s; }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .rule {
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
        animation: draw 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }

      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse {
        0%, 100% { opacity: 1; r: 5; }
        50%      { opacity: 0.45; r: 6.5; }
      }

      .halo { animation: halo 2.4s ease-out infinite; transform-origin: center; }
      @keyframes halo {
        0%   { r: 5; opacity: 0.5; }
        70%  { r: 14; opacity: 0; }
        100% { r: 14; opacity: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <rect width="1000" height="240" fill="url(#grid)"/>

    <!-- slow light sweep -->
    <rect x="-500" y="0" width="500" height="240" fill="url(#sweep)">
      <animate attributeName="x" values="-500;1000" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- left accent bar -->
    <rect x="0" y="0" width="4" height="240" fill="url(#accent)"/>

    <g transform="translate(56, 0)">
      <text class="fade d1" x="0" y="86"
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
            font-size="46" font-weight="700" fill="#F1F5F9" letter-spacing="-0.8">Bhuvan Prakash</text>

      <line class="rule" x1="0" y1="106" x2="300" y2="106"
            stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

      <text class="fade d2" x="0" y="146"
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
            font-size="21" font-weight="500" fill="#94A3B8" letter-spacing="0.2">Software Engineer &#183; Android &amp; Full-Stack</text>

      <text class="fade d3" x="0" y="182"
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
            font-size="15" font-weight="400" fill="#64748B">B.E. Computer Science (Data Science) &#183; Class of 2026 &#183; Bangalore, India</text>

      <g class="fade d4" transform="translate(0, 208)">
        <circle class="halo" cx="6" cy="0" r="5" fill="#34D399"/>
        <circle class="pulse" cx="6" cy="0" r="5" fill="#34D399"/>
        <text x="22" y="5"
              font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
              font-size="14" font-weight="500" fill="#34D399" letter-spacing="0.3">Open to full-time roles &#183; 2026</text>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="999" height="239" rx="16" fill="none" stroke="#1E293B" stroke-width="1"/>
  </g>
</svg>
